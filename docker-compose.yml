# ARTHUR MVP — docker-compose
# API + worker services. Postgres / Redis / pgvector are COMMENTED OUT
# (Phase 5 — the MVP runs on SQLite only; uncomment to experiment later).

services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./requirements.txt:/app/requirements.txt
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - ARTHUR_HOME=/app
      - ARTHUR_DB_PATH=/app/data/arthur.db
    command: >
      sh -c "pip install -q -r requirements.txt &&
             uvicorn backend.api.server:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./requirements.txt:/app/requirements.txt
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - ARTHUR_HOME=/app
      - ARTHUR_DB_PATH=/app/data/arthur.db
    command: >
      sh -c "pip install -q -r requirements.txt &&
             python backend/tasks/worker.py"

